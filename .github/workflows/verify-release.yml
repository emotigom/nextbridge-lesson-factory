name: Verify Release Contract
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify current example remains HOLD
        run: python3 tools/lessonctl/lessonctl.py release verify --manifest releases/manifests/feed-why-v0.4.example.json
